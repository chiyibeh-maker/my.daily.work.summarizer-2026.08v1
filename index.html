<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Progress Tracker Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --primary: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); padding: 24px; }
        .studio-container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
        
        header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon { width: 40px; height: 40px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        .main-grid { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
        @media (max-width: 1000px) { .main-grid { grid-template-columns: 1fr; } }
        
        .panel { background: var(--bg-card); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 16px; }
        
        .task-form-box { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; background: #0f172a; padding: 16px; border-radius: 8px; border: 1px solid var(--border-color); }
        @media (max-width: 700px) { .task-form-box { grid-template-columns: 1fr; } }
        
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        
        input, select { background: #1e293b; border: 1px solid var(--border-color); color: white; padding: 8px 12px; border-radius: 6px; outline: none; font-size: 13px; }
        
        .btn { padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-amber { background: #f59e0b; color: black; }
        .btn-green { background: #10b981; color: white; }
        .btn-secondary { background: #334155; color: white; }
        .btn-danger { background: #f43f5e; color: white; padding: 4px 8px; font-size: 11px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: #0f172a; color: var(--text-muted); font-size: 11px; text-transform: uppercase; }

        .bot-box { background: #090d16; border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; white-space: pre-wrap; min-height: 220px; color: #e2e8f0; line-height: 1.5; }
        .badge-priority { background: rgba(245, 158, 11, 0.2); color: #fbbf24; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
        .timer-badge { font-family: 'JetBrains Mono', monospace; background: #0f172a; padding: 4px 6px; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>

<div class="studio-container">
    <header>
        <div class="brand">
            <div class="brand-icon">⚡</div>
            <div>
                <h2>Work Progress Tracker Studio</h2>
                <p style="font-size: 12px; color: var(--text-muted);">Boss Bot Daily Check-in Generator</p>
            </div>
        </div>
        <div>
            <button class="btn btn-amber" type="button" id="morning-btn">🌅 Morning Check-in (9:30 AM)</button>
            <button class="btn btn-green" type="button" id="evening-btn">🌆 Evening Check-out (6:00 PM)</button>
        </div>
    </header>

    <div class="main-grid">
        <div class="panel">
            <h3>📋 Daily Task Board</h3>
            
            <div class="task-form-box">
                <div class="form-group" style="grid-column: span 2;">
                    <label>Task Name</label>
                    <input type="text" id="task-name" placeholder="What are you working on?">
                </div>
                <div class="form-group">
                    <label>Proof / Output Link</label>
                    <input type="text" id="task-proof" placeholder="Link, PR, count or screenshot">
                </div>
                <div class="form-group" style="justify-content: flex-end;">
                    <button class="btn btn-primary" type="button" id="add-btn">+ Add Task</button>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Blockers / Notes</label>
                    <input type="text" id="task-blocker" placeholder="Any issues blocking progress?">
                </div>
                <div class="form-group">
                    <label>Priority</label>
                    <label style="display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; cursor:pointer;">
                        <input type="checkbox" id="task-priority"> ⭐ Top Priority
                    </label>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width: 35%;">Task</th>
                        <th style="width: 15%;">Status</th>
                        <th style="width: 20%;">Timer</th>
                        <th style="width: 20%;">Proof / Blocker</th>
                        <th style="width: 10%;">Action</th>
                    </tr>
                </thead>
                <tbody id="task-table-body">
                </tbody>
            </table>
        </div>

        <div class="panel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 id="bot-title">🤖 Boss Bot Output</h3>
                <button class="btn btn-secondary" type="button" id="copy-btn">📋 Copy Text</button>
            </div>
            <div class="bot-box" id="bot-output">Add tasks on the left, then click 'Morning Check-in' or 'Evening Check-out' above.</div>
        </div>
    </div>
</div>

<script>
    let tasks = [];
    try {
        tasks = JSON.parse(localStorage.getItem('studio_tasks_v2')) || [];
    } catch(e) {
        tasks = [];
    }

    let activeTab = 'morning';

    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('add-btn').addEventListener('click', addNewTask);
        document.getElementById('morning-btn').addEventListener('click', generateMorningBot);
        document.getElementById('evening-btn').addEventListener('click', generateEveningBot);
        document.getElementById('copy-btn').addEventListener('click', copyOutput);
        
        renderTable();
        generateMorningBot();
    });

    function saveAndRender() {
        localStorage.setItem('studio_tasks_v2', JSON.stringify(tasks));
        renderTable();
        if (activeTab === 'morning') generateMorningBot();
        else generateEveningBot();
    }

    function addNewTask() {
        const nameInput = document.getElementById('task-name');
        const proofInput = document.getElementById('task-proof');
        const blockerInput = document.getElementById('task-blocker');
        const priorityInput = document.getElementById('task-priority');

        const taskName = nameInput.value.trim();
        if (!taskName) {
            alert('Please type a task description first!');
            return;
        }

        const newTask = {
            id: Date.now(),
            name: taskName,
            proof: proofInput.value.trim(),
            blocker: blockerInput.value.trim(),
            priority: priorityInput.checked,
            status: "Planned",
            seconds: 0,
            timerOn: false,
            startTime: null
        };

        tasks.push(newTask);
        
        nameInput.value = '';
        proofInput.value = '';
        blockerInput.value = '';
        priorityInput.checked = false;

        saveAndRender();
    }

    function toggleTimer(id) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;

        if (task.timerOn) {
            const elapsed = Math.floor((Date.now() - task.startTime) / 1000);
            task.seconds += elapsed;
            task.timerOn = false;
            task.startTime = null;
            task.status = "Completed";
        } else {
            task.timerOn = true;
            task.startTime = Date.now();
            task.status = "In Progress";
        }
        saveAndRender();
    }

    function changeStatus(id, newStatus) {
        const task = tasks.find(t => t.id === id);
        if (task) {
            if (task.timerOn && newStatus === "Completed") {
                toggleTimer(id);
            } else {
                task.status = newStatus;
                saveAndRender();
            }
        }
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        saveAndRender();
    }

    function formatSecs(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return m > 0 ? `${m}m ${s}s` : `${s}s`;
    }

    function renderTable() {
        const tbody = document.getElementById('task-table-body');
        tbody.innerHTML = '';

        if (tasks.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b; padding:20px;">No tasks logged yet. Type a task above and click + Add Task.</td></tr>`;
            return;
        }

        tasks.forEach(task => {
            let currentSec = task.seconds;
            if (task.timerOn && task.startTime) {
                currentSec += Math.floor((Date.now() - task.startTime) / 1000);
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    ${task.priority ? '<span class="badge-priority">⭐ PRIORITY</span> ' : ''}
                    <strong>${escapeHtml(task.name)}</strong>
                </td>
                <td>
                    <select onchange="changeStatus(${task.id}, this.value)" style="padding:4px; font-size:11px;">
                        <option value="Planned" ${task.status === 'Planned' ? 'selected' : ''}>Planned</option>
                        <option value="In Progress" ${task.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                        <option value="Completed" ${task.status === 'Completed' ? 'selected' : ''}>Completed</option>
                        <option value="Blocked" ${task.status === 'Blocked' ? 'selected' : ''}>Blocked</option>
                    </select>
                </td>
                <td>
                    <span class="timer-badge">${formatSecs(currentSec)}</span>
                    <button class="btn btn-secondary" style="padding:2px 6px; font-size:11px;" onclick="toggleTimer(${task.id})">
                        ${task.timerOn ? '⏹ Stop' : '▶ Start'}
                    </button>
                </td>
                <td style="font-size:11px; color:#94a3b8;">
                    ${task.proof ? `<div>🔗 ${escapeHtml(task.proof)}</div>` : ''}
                    ${task.blocker ? `<div style="color:#f43f5e;">⚠️ ${escapeHtml(task.blocker)}</div>` : ''}
                    ${!task.proof && !task.blocker ? '-' : ''}
                </td>
                <td>
                    <button class="btn btn-danger" onclick="deleteTask(${task.id})">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function generateMorningBot() {
        activeTab = 'morning';
        document.getElementById('bot-title').innerText = "🌅 Morning Check-in Output";
        
        const active = tasks.filter(t => t.status !== "Completed");
        const priority = tasks.find(t => t.priority) || active[0];
        const blocked = tasks.filter(t => t.status === "Blocked" || t.blocker);

        let q1 = active.length ? active.map(t => `• ${t.name}`).join('\n') : "• Finishing up ongoing tasks";
        let q2 = priority ? `• ${priority.name}` : "• Standard task flow";
        let q3 = blocked.length ? blocked.map(t => `• ${t.name}: ${t.blocker || 'Blocked'}`).join('\n') : "None";

        const text = `1. What are you working on today?\n${q1}\n\n2. Which one matters most if today gets cut short?\n${q2}\n\n3. Anything blocking you?\n${q3}`;
        document.getElementById('bot-output').innerText = text;
    }

    function generateEveningBot() {
        activeTab = 'evening';
        document.getElementById('bot-title').innerText = "集成 Evening Check-out Output";
        
        const done = tasks.filter(t => t.status === "Completed");
        const carry = tasks.filter(t => t.status !== "Completed");
        const proof = tasks.filter(t => t.proof);

        let q1 = done.length ? done.map(t => `• ${t.name} (${formatSecs(t.seconds)})`).join('\n') : "• Progressed ongoing tasks";
        let q2 = proof.length ? proof.map(t => `• ${t.name}: ${t.proof}`).join('\n') : "None";
        let q3 = carry.length ? carry.map(t => `• ${t.name} [${t.status}]`).join('\n') : "Nothing carried over";

        const text = `1. What did you get done today?\n${q1}\n\n2. Anything to show for it?\n${q2}\n\n3. What's carrying over to tomorrow, if anything?\n${q3}`;
        document.getElementById('bot-output').innerText = text;
    }

    function copyOutput() {
        const text = document.getElementById('bot-output').innerText;
        navigator.clipboard.writeText(text);
        alert('Copied check-in summary to clipboard! 🚀');
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    setInterval(() => {
        if (tasks.some(t => t.timerOn)) {
            renderTable();
        }
    }, 1000);
</script>
</body>
</html>
